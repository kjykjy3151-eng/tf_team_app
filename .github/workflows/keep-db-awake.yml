# 2026-10-27 17:22 KST
# Supabase 무료 프로젝트가 1주일 동안 요청이 적으면 일시정지되므로 하루 한 번 DB에 질의한다.
# 비공개 저장소의 GitHub Actions 무료 사용량 안에서 한 번에 1분 정도 쓴다.
name: keep-db-awake

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 09:00 KST(00:00 UTC)
  workflow_dispatch: {}  # Actions 탭에서 손으로도 실행

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "psycopg[binary]>=3.2"
      - name: SELECT 1
        run: python scripts/ping_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
